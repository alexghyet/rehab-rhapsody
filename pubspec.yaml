name: rehab_rhapsody
description: "A music-based rehabilitation app for iPhone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: 6.8.1
  audio_session: 0.2.4
  universal_ble: 3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/demo/
    - assets/audio/songs/
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-600.ttf
          weight: 600
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
